<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook — Final Mock-up</title>
<style>
/* =====================================================================
   DAYBOOK — merged from the Encore × Daybook decisions (Oct 7)
   Palette: Encore's (paper, ink, gold, stage black) with Daybook's burgundy as the main colour.
   Type: iOS native (picked Oct 7 in font-picker.html): New York headings, SF Pro body, SF Mono labels.
   They ship with every iPhone, so nothing is bundled in Xcode. Off Apple devices / in Chrome the
   stacks fall back to Iowan Old Style or Georgia, system sans and Menlo.
   Visual style: Daybook's (rounded cards, hand-cut icon tiles, ink stamps, washi tape, paper grain).
   ===================================================================== */
:root{
  --serif:ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, monospace;
  --ds:.86; --sw:600;   /* New York runs wider than the old poster serif: headings a touch smaller, semibold */
  --r:18px; --r-sm:12px; --r-xs:8px;
  --top:62px;
  --wine:#6F1725; --wine-2:#8A2233; --wine-3:#A63446; --wine-deep:#3A0A12; --wine-ink:#24060B;
  --gold:#B8913A; --gold-2:#E2C67A; --on-wine:#FBF2EC; --stage:#120C0E;
}
.phone,.phone[data-theme="paper"]{
  --bg:#F0EEEA; --bg-2:#E8E4DD; --card:#FAF9F6; --card-2:#F4F1EC; --line:#DDD6CC; --line-2:#C2B8AA;
  --ink:#141010; --ink-2:#58504B; --ink-3:#928880;
  --acc:#6F1725; --acc-2:#8A2233; --acc-soft:#F0E1E3; --acc-mid:#D9B3B9;
  --gold-ink:#8C6A22; --gold-soft:#F2E8CF;
  --yel:#F2C14E; --yel-soft:#FBF0CF; --yel-track:#F6E3AE; --yel-ink:#7E5A0B;   /* highlight: progress + things waiting on you */
  --shadow:0 1px 0 rgba(20,16,16,.03), 0 6px 16px -10px rgba(58,10,18,.28);
  --tab-bg:rgba(250,249,246,.94); --grain:rgba(20,16,16,.045);
}
.phone[data-theme="stage"]{
  --bg:#120C0E; --bg-2:#1A1214; --card:#1D1517; --card-2:#251B1D; --line:#35282B; --line-2:#4E3D41;
  --ink:#F3EAE4; --ink-2:#BFAFA8; --ink-3:#86776F;
  --acc:#C14A62; --acc-2:#D8647A; --acc-soft:#33161D; --acc-mid:#6E2534;
  --gold-ink:#D9B465; --gold-soft:#2C2215;
  --yel:#E8B94A; --yel-soft:#33280F; --yel-track:#4A3A16; --yel-ink:#F0CC6A;
  --shadow:0 8px 20px -12px rgba(0,0,0,.7);
  --tab-bg:rgba(18,12,14,.94); --grain:rgba(255,255,255,.035);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;background:var(--stage);color:#F3EAE4;
  background-image:radial-gradient(55% 70% at 63% 45%, rgba(111,23,37,.55), transparent 72%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 3px, transparent 3px 26px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
svg{display:block}

/* ---------- desktop stage + phone ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:64px;padding:32px 24px}
.side{width:270px;flex:none}
.side .logo{font-family:var(--serif);font-style:italic;font-size:calc(76px * var(--ds,1));line-height:.9;color:#F6EDE6;letter-spacing:-.02em;font-weight:var(--sw,400)}
.side .logo span{color:#C14A62}
.side .sub{color:#B9A69F;font-size:14px;margin:14px 0 24px;line-height:1.5}
.side h4{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#85736D;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.side h4::after{content:"";flex:1;height:1px;background:#3b2a2d}
.jump{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 0;font-size:15px;font-weight:500;color:#F0E4DE;border-bottom:1px solid #2c1f22}
.jump:hover{color:#fff}
.jump .no{font-family:var(--mono);font-size:10.5px;color:#85736D;width:18px}
.themes{display:flex;border:1px solid #3b2a2d}
.themes button{flex:1;height:34px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9E8D86}
.themes button.on{background:#F3EAE4;color:#141010}
.side .note{font-family:var(--mono);font-size:10.5px;color:#85736D;margin-top:16px;line-height:1.6}
.device{width:390px;height:844px;border-radius:58px;background:#050303;padding:11px;flex:none;position:relative;
  box-shadow:0 0 0 1.5px #3d2a2e, 0 50px 90px -30px rgba(0,0,0,.9), 0 0 120px -20px rgba(111,23,37,.45)}
.phone{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate;
  background-image:radial-gradient(var(--grain) .8px, transparent .9px);background-size:11px 11px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:300}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 36px;
  font-weight:600;font-size:15px;z-index:80;pointer-events:none;color:var(--ink);background:linear-gradient(var(--bg) 70%, transparent)}
.statusbar.light{color:#fff;background:none;z-index:170}
.statusbar .sys{display:flex;gap:6px;align-items:center}
#view{position:absolute;inset:0;display:flex;flex-direction:column}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--top) 16px 112px;scrollbar-width:none;overscroll-behavior:contain}
.content::-webkit-scrollbar{display:none}
@media (max-width:900px){ .side{display:none} }
@media (max-width:480px){
  :root{--top:calc(env(safe-area-inset-top) + 14px)}
  .stage{padding:0;display:block}
  .device{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .phone{border-radius:0}
  .island,.statusbar{display:none}
  .tabbar{padding-bottom:calc(8px + env(safe-area-inset-bottom))!important;height:auto!important}
}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow.acc{color:var(--acc)}
.title{font-family:var(--serif);font-weight:var(--sw,400);font-size:calc(34px * var(--ds,1));line-height:.98;letter-spacing:-.015em}
.title em{font-style:italic;color:var(--acc)}
.h2{font-family:var(--serif);font-weight:var(--sw,400);font-size:calc(26px * var(--ds,1));line-height:1.02;letter-spacing:-.01em}
.h2 em{font-style:italic;color:var(--acc)}
.serif-note{font-family:var(--serif);font-style:italic;color:var(--acc);font-size:calc(17px * var(--ds,1));line-height:1.2;font-weight:var(--sw,400)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.sec{display:flex;align-items:baseline;gap:8px;margin:22px 2px 8px}
.sec .h{font-family:var(--serif);font-size:calc(23px * var(--ds,1));line-height:1;font-weight:var(--sw,400)}
.sec .cnt{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);background:var(--bg-2);border-radius:99px;padding:2px 8px}
.sec .sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;font-family:var(--sans)}
.sec .link{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}

/* ---------- surfaces (Daybook style) ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow), inset 0 0 0 1px color-mix(in srgb, var(--acc) 14%, transparent);padding:16px}
.card.flat{box-shadow:inset 0 0 0 1px var(--line)}
.ruled{background-image:repeating-linear-gradient(transparent 0 27px, color-mix(in srgb, var(--acc) 10%, transparent) 27px 28px)}
.tape{position:absolute;height:16px;width:64px;background:color-mix(in srgb, var(--gold-2) 70%, transparent);opacity:.85;
  background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 3px, transparent 3px 9px);clip-path:polygon(3% 0,97% 4%,100% 50%,97% 96%,3% 100%,0 50%)}
.tape.wine{background-color:color-mix(in srgb, var(--acc) 45%, transparent)}
/* hand-cut icon tile */
.tile{width:44px;height:44px;display:grid;place-items:center;flex:none;color:var(--acc);
  background:color-mix(in srgb, var(--acc) 11%, var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--acc) 30%, transparent);
  border-radius:14px 11px 15px 12px / 12px 15px 11px 14px;transform:rotate(-2deg)}
.tile.on{background:var(--acc);color:var(--on-wine);box-shadow:none}
.tile.gold{color:var(--gold-ink);background:var(--gold-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent)}
.tile.sm{width:34px;height:34px;border-radius:11px 9px 12px 10px / 10px 12px 9px 11px}
.tile.lg{width:56px;height:56px;border-radius:17px 14px 18px 15px / 15px 18px 14px 17px}
/* rubber ink stamp */
.stamp{width:var(--sz,80px);height:var(--sz,80px);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--acc);border:calc(var(--sz,80px) * .05) solid currentColor;opacity:.92;position:relative;font-family:var(--mono);font-weight:500;
  font-size:calc(var(--sz,80px) * .13);letter-spacing:.12em;text-transform:uppercase}
.stamp::before{content:"";position:absolute;inset:calc(var(--sz,80px) * .08);border-radius:50%;border:1.5px dashed currentColor;opacity:.7}

/* ---------- controls ---------- */
.btn{height:48px;border-radius:var(--r-sm);padding:0 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--acc);color:var(--on-wine);box-shadow:0 3px 0 color-mix(in srgb, var(--acc) 30%, transparent);transition:transform .12s, box-shadow .12s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb, var(--acc) 30%, transparent)}
.btn.ink{background:var(--ink);color:var(--bg);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn.line{background:var(--card);color:var(--acc);box-shadow:inset 0 0 0 1.2px color-mix(in srgb, var(--acc) 50%, transparent)}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:none;height:40px}
.btn.cream{background:#F6EDE6;color:var(--wine-ink);box-shadow:none}
.btn.sm{height:36px;width:auto;font-size:13px;padding:0 13px;border-radius:10px}
.btn[disabled]{opacity:.35;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:11px;font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.chip.on{background:var(--acc);color:var(--on-wine);box-shadow:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink);background:var(--card);box-shadow:var(--shadow), inset 0 0 0 1px var(--line);position:relative}
.icon-btn.acc{background:var(--acc);color:var(--on-wine);box-shadow:none}
.icon-btn .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:var(--on-wine);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg)}
.seg{display:flex;background:var(--bg-2);border-radius:12px;padding:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.field{display:block;background:var(--card);border-radius:var(--r-sm);padding:10px 14px;box-shadow:inset 0 0 0 1px var(--line);cursor:text}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.field input,.field textarea{width:100%;font-size:16px;font-weight:500}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-3);font-weight:400}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc)}
.toggle-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0}
.toggle-row b{display:block;font-weight:600;font-size:15px}
.toggle-row b + span{font-size:12.5px;color:var(--ink-3)}
.sw{margin-left:auto;width:46px;height:28px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.on>.sw,.sw.on{background:var(--acc)}
.on>.sw::after,.sw.on::after{transform:translateX(18px)}

/* ---------- avatars (preset drawings) ---------- */
.av{--s:30px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-block;position:relative;overflow:visible}
.av svg{width:100%;height:100%}
.av .ok{position:absolute;right:-2px;bottom:-2px;width:42%;height:42%;min-width:12px;min-height:12px;border-radius:50%;background:var(--acc);color:var(--on-wine);display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.stack{display:flex}
.stack .av{margin-left:calc(var(--s) * -.3);box-shadow:0 0 0 2px var(--card);border-radius:50%}
.stack .av:first-child{margin-left:0}
.stack .more{width:var(--s,26px);height:var(--s,26px);border-radius:50%;background:var(--bg-2);font-size:10px;font-weight:700;color:var(--ink-2);display:grid;place-items:center;margin-left:-8px;box-shadow:0 0 0 2px var(--card)}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:10px;right:10px;bottom:14px;height:68px;padding:8px 6px;background:var(--tab-bg);border-radius:26px;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 12px 30px -14px rgba(0,0,0,.45), inset 0 0 0 1px var(--line);display:flex;z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);border-radius:20px;position:relative}
.tab.on{color:var(--acc);background:var(--yel-soft)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--tab-bg)}

/* ---------- pages pushed on top (profile, group, friends…) ---------- */
.nav-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:38px}
.nav-bar .ttl{flex:1;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- toast ---------- */
#toast-root{position:absolute;left:0;right:0;bottom:96px;display:flex;justify-content:center;z-index:200;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--ink);padding:10px 12px 10px 10px;border-radius:16px;max-width:350px;pointer-events:auto;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.45), inset 0 0 0 1px color-mix(in srgb, var(--acc) 40%, transparent);animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2)}
.toast .ti{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--on-wine);display:grid;place-items:center;flex:none}
.toast span{font-weight:600;font-size:14px}
.toast button{margin-left:6px;font-weight:700;color:var(--acc);font-size:14px}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* ---------- sheets / popups ---------- */
#sheet-root{position:absolute;inset:0;z-index:100;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(18,8,10,.45);opacity:0;transition:opacity .3s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:93%;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);pointer-events:auto;
  background-image:radial-gradient(var(--grain) .8px, transparent .9px);background-size:11px 11px}
.sheet.tall{height:93%}
.open .backdrop{opacity:1}
.open .sheet{transform:none}
.grabber{width:38px;height:5px;border-radius:99px;background:var(--line-2);margin:9px auto 2px;flex:none}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:10px 18px 8px;flex:none}
.sheet-body{overflow-y:auto;padding:6px 18px 32px;scrollbar-width:none;flex:1 1 auto;min-height:0}
.sheet-body::-webkit-scrollbar{display:none}
.close-x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.empty{text-align:center;padding:22px 16px;color:var(--ink-3);font-size:13.5px;border:1.5px dashed var(--line-2);border-radius:var(--r)}
@keyframes pop{40%{transform:scale(1.15)}}
@keyframes floaty{50%{transform:translateY(-8px)}}
</style>
<style>
/* =============== TODAY =============== */
.list-head{display:flex;justify-content:flex-end;margin:14px 0 2px}
.avbtn{width:38px;height:38px;border-radius:50%;flex:none}
.greet{font-size:15px;color:var(--ink-2);margin:4px 2px 0}
.greet b{font-weight:600;color:var(--acc)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--card);border-radius:16px;padding:6px;margin-top:14px;
  box-shadow:var(--shadow), inset 0 0 0 1px color-mix(in srgb, var(--acc) 14%, transparent)}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 7px;border-radius:12px;min-height:62px}
.wd .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3)}
.wd .rg{position:relative;width:30px;height:30px;display:grid;place-items:center}
.wd .rg svg{position:absolute;inset:0;transform:rotate(-90deg)}
.wd .rg b{font-family:var(--serif);font-weight:var(--sw,400);font-size:calc(17px * var(--ds,1));line-height:1;position:relative}
.wd .td{width:4px;height:4px;border-radius:50%;background:var(--acc)}
.wd.sel{background:var(--acc);color:var(--on-wine)}
.wd.sel .l{color:color-mix(in srgb, var(--on-wine) 70%, transparent)}
.wd.sel .td{background:var(--on-wine)}
.wd.future{opacity:.38;pointer-events:none}
.prog{display:flex;align-items:center;gap:14px;margin-top:10px;padding:13px 16px}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-family:var(--sans);font-weight:700;font-size:17px;line-height:1;letter-spacing:-.01em;display:flex;align-items:baseline;gap:1px}
.ring .in b i{font-style:normal;font-weight:500;font-size:13px;color:var(--ink-3)}
.ring .in small{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.prog-txt{font-size:16px;font-weight:600;flex:1;min-width:0}
.wk7{flex:none;display:flex;flex-direction:column;align-items:center}
.wk7 .eyebrow{font-size:9px;letter-spacing:.14em;margin-bottom:6px}
.dots7.lg{gap:4px}
.dots7.lg i{width:13px;height:13px;border-radius:4px}
.wk7 .lt{display:flex;gap:4px;margin-top:4px}
.wk7 .lt span{width:13px;text-align:center;font-family:var(--mono);font-size:9px;line-height:1;color:var(--ink-3)}
.wk7 .lt span.now{color:var(--acc);font-weight:500}
/* habit card */
.hc{margin-bottom:6px;padding:0;overflow:hidden;transition:box-shadow .25s;border-radius:10px}
.hc.done{box-shadow:var(--shadow), inset 0 0 0 1.2px color-mix(in srgb, var(--acc) 55%, transparent);background:color-mix(in srgb, var(--acc) 5%, var(--card))}
.hc-row{display:flex;align-items:center;gap:12px;padding:9px 11px 9px 14px}
.hc-body{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left}
.hc .tile{width:36px;height:36px;border-radius:12px 10px 13px 10px / 10px 13px 10px 12px}
.hc-txt{flex:1;min-width:0}
.hc-name{display:block;font-weight:600;font-size:15px;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc.done .hc-name{text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--acc) 60%, transparent);color:var(--ink-2)}
.hc-foot{display:flex;align-items:center;gap:10px;margin-top:5px;min-height:20px}
.dots7{display:flex;gap:3px}
.dots7 i{width:10px;height:10px;border-radius:3px;background:var(--bg-2);box-shadow:inset 0 0 0 1px var(--line)}
.dots7 i.on{background:var(--acc);box-shadow:none}
.dots7 i.now{box-shadow:inset 0 0 0 1.4px color-mix(in srgb, var(--ink) 55%, transparent)}

.dots7 i.half{background:color-mix(in srgb, var(--acc) 38%, var(--bg-2));box-shadow:none}
.dots7 i.half.now{box-shadow:inset 0 0 0 1.4px color-mix(in srgb, var(--ink) 55%, transparent)}
.hc .stack{--s:20px}
.hc .stack .av{--s:20px}
/* the check: Daybook stamp look, Encore tap-to-tick behaviour */
.ck{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ink-3);
  border:1.6px solid color-mix(in srgb, var(--acc) 60%, transparent);background:var(--card);transition:transform .15s}
.tlabel{display:flex;align-items:center;gap:8px;margin:8px 4px 4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.tlabel::after{content:"";flex:1;height:1px;background:var(--line)}
.list-head + .tlabel{margin-top:0}
.ck:active{transform:scale(.88)}
.ck.on{border:0;background:var(--acc);color:var(--on-wine);transform:rotate(-6deg)}
.ck.on svg{animation:stampIn .45s cubic-bezier(.2,.9,.3,1.3)}
.ck.ring-out{box-shadow:0 0 0 0 color-mix(in srgb, var(--acc) 50%, transparent);animation:ringOut .6s ease-out}
@keyframes stampIn{from{transform:scale(1.7) rotate(-18deg);opacity:0}}
@keyframes ringOut{to{box-shadow:0 0 0 14px transparent}}
.hdrop{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.9,.25,1)}
.hc.open .hdrop{grid-template-rows:1fr}
.hdrop>div{overflow:hidden;min-height:0}
.dd-btn{display:flex;align-items:center;gap:12px;width:calc(100% - 28px);margin:0 14px 14px;padding:11px 12px;border-radius:12px;text-align:left;
  background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line)}
.dd-btn .tile{width:32px;height:32px;transform:none;border-radius:10px}
.dd-btn b{display:block;font-size:14px;font-weight:600}
.dd-btn b + span{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.dd-btn .go{margin-left:auto;color:var(--acc)}
.foot-actions{display:grid;gap:8px;margin-top:16px}
.foot-actions .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* =============== HABIT DETAILS POPUP =============== */
.det-head{display:flex;align-items:center;gap:12px}
.det-head .nm{font-family:var(--serif);font-size:calc(28px * var(--ds,1));line-height:1;font-weight:var(--sw,400)}
.det-head .sb{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.blk{margin-top:16px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.blk-h .eyebrow b{color:var(--acc);font-weight:500}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.d7{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.d7 i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--on-wine);box-shadow:inset 0 0 0 1.4px var(--line-2)}
.d7.on i{background:var(--acc);box-shadow:none}
.d7.today{color:var(--ink);font-weight:500}

.streak-big{display:flex;align-items:center;gap:14px;margin-bottom:12px}

.streak-big span{font-size:13px;color:var(--ink-2);line-height:1.35}
.pstrip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 16px}
.pstrip::-webkit-scrollbar{display:none}
.pt{flex:none;width:78px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;scroll-snap-align:start}
.pt .pimg{width:78px;height:98px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;position:relative;overflow:hidden}
.pt.is-photo .pimg{color:rgba(255,236,226,.88);background:radial-gradient(70% 55% at 50% 30%, #A63446 0, #6F1725 52%, #24060B 100%)}
.pt.is-photo .pimg::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-18px;height:40px;opacity:.28;transform:perspective(80px) rotateX(50deg);background:repeating-conic-gradient(#efe6da 0 25%, #151010 0 50%) 0 0/16px 16px}
.pt .pav{position:absolute;left:5px;bottom:5px;z-index:1;display:flex}
.pt .pav .av{--s:20px;box-shadow:0 0 0 1.5px #24060B;border-radius:50%}
.pt.is-plain .pimg{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.pt .okc{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--on-wine);display:grid;place-items:center}
.pt .tl{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:1.3}
.pt .addp{position:absolute;top:5px;right:5px;font-size:9px;font-weight:700;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:99px}
.pt.is-mine .pimg{border:1.5px dashed var(--acc);color:var(--acc)}

.pt .pn{font-size:12px;font-weight:600;margin-top:6px;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .ps{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.pt.is-todo .pn{color:var(--ink-3)}
.mg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mg-head b{font-family:var(--serif);font-weight:var(--sw,400);font-size:calc(22px * var(--ds,1))}
.mg-head button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--acc)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.mgrid .wl{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);padding-bottom:4px}
.mday{height:40px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:500;position:relative}

.mday.done{background:var(--acc);color:var(--on-wine)}
.mday.miss{box-shadow:inset 0 0 0 1px var(--line-2)}
.mday.today{font-weight:700}
.mday.today:not(.done){box-shadow:inset 0 0 0 1.6px var(--ink)}
.mday.sel{outline:2px solid var(--acc);outline-offset:1px}
.mday .ds{display:flex;gap:2px}
.mday .ds i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.mday.full::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1.5px solid color-mix(in srgb, var(--acc) 70%, transparent);transform:rotate(-12deg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.dayrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dayrow:first-of-type{border-top:0}
.dayrow .t{flex:1;min-width:0}
.dayrow b{display:block;font-weight:600;font-size:14.5px}
.dayrow .t span{font-size:12.5px;color:var(--ink-3)}
.det-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}

/* =============== GROUPS =============== */
.g-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px}

.friends-pill{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 6px;border-radius:99px;background:var(--card);box-shadow:var(--shadow), inset 0 0 0 1px var(--line);font-weight:600;font-size:13px}

.poster{flex:none;border-radius:var(--r);padding:14px;position:relative;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column;text-align:left;cursor:pointer}

.poster>*{position:relative;z-index:1}
.poster .wm{position:absolute;right:-16px;bottom:-22px;opacity:.2;z-index:0}
.poster .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.poster .t{font-family:var(--serif);font-size:calc(30px * var(--ds,1));line-height:.95;letter-spacing:-.015em;margin-top:auto;max-width:88%;font-weight:var(--sw,400)}
.poster .t em{font-style:italic}
.poster .d{font-size:12.5px;opacity:.82;margin-top:4px}
.poster .r{display:flex;align-items:center;gap:8px;margin-top:10px}
.poster .r .stack .av{--s:22px;box-shadow:0 0 0 2px rgba(0,0,0,.2)}
.poster .r .sx{flex:1;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{height:28px;padding:0 12px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;flex:none;font-size:12px;font-weight:700;background:var(--yel);color:#24060B}
.pbtn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.poster.v-wine{color:#FBF2EC;background:radial-gradient(90% 70% at 40% 25%, #A63446 0, #6F1725 48%, #24060B 100%)}
.poster.v-curtain{color:#FBF2EC;background:repeating-linear-gradient(90deg,#3A0A12 0 6px,#5A1220 6px 16px,#8A2233 16px 22px,#5A1220 22px 30px)}
.poster.v-curtain::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(60% 80% at 35% 35%, rgba(255,150,160,.3), transparent 70%), linear-gradient(transparent 35%, rgba(0,0,0,.55))}
.poster.v-ink{background:#161012;color:#F3EAE4}
.poster.v-paper{background:#F7F3EE;color:#141010;box-shadow:inset 0 0 0 1px #D6CCC0}
.poster.v-paper .k,.poster.v-paper .t em{color:#6F1725}
.dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.dots i{width:5px;height:5px;border-radius:3px;background:var(--line-2);transition:width .3s,background .3s}
.dots i.on{width:16px;background:var(--acc)}
.inv{padding:14px;margin-bottom:10px;box-shadow:var(--shadow), inset 0 0 0 1.2px color-mix(in srgb, var(--yel) 70%, transparent);background:var(--yel-soft)}
.inv-acts{display:flex;gap:8px;margin-top:12px;align-items:center}
.grow{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.grow .t{flex:1;min-width:0}
.grow b{display:block;font-family:var(--serif);font-weight:var(--sw,400);font-size:calc(22px * var(--ds,1));line-height:1.05}
.grow .dt{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grow .stack{--s:24px}
.grow .stack .av{--s:24px}
.gcard{margin-bottom:10px;width:100%;display:block;text-align:left}
.gcard{padding:12px 14px}
.gtop{display:flex;align-items:center;gap:10px}
.gtop b{flex:1;min-width:0;display:block;font-family:var(--serif);font-weight:var(--sw,400);font-size:calc(20px * var(--ds,1));line-height:1.1}

.gtop .stack .av{--s:22px}

.gic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--ink-2);background:var(--bg-2);box-shadow:inset 0 0 0 1px var(--line)}
.inv{cursor:pointer}
.inv-from{font-size:12.5px;color:var(--ink-2);margin:6px 0 0 38px}
.inv-peek{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--yel-ink)}
.req-card{padding:8px 14px;margin-bottom:12px;background:var(--yel-soft);box-shadow:var(--shadow), inset 0 0 0 1.2px color-mix(in srgb, var(--yel) 70%, transparent)}

.pbar{height:6px;border-radius:99px;background:var(--bg-2);margin-top:6px;overflow:hidden;position:relative}

/* discover */

.req b{display:block;font-weight:600;font-size:14.5px}

.xbtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}

}

/* ---------- month grid (Daybook's calendar, shown in habit details) ---------- */
function monthDone(h, y, mo, day){                      // past days: real data for Oct 1-7, a steady pattern before that
  const d = new Date(y, mo, day), diff = Math.round((TODAY - d) / 864e5);
  if (diff < 0) return null;
  if (diff <= 6) return week(h, 'me')[6 - diff];
  const seed = (day * 7 + h.id.length * 13 + mo * 3) % 10; return seed < 8 ? 1 : 0;
}
function monthGrid(opts){
  const {y, mo, habit} = opts, first = new Date(y, mo, 1), days = new Date(y, mo + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7, cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span class="mday out"></span>');
  for (let d = 1; d <= days; d++){
    const date = new Date(y, mo, d), fut = date > TODAY, isToday = +date === +TODAY;
    let cls = 'mday';
    if (fut) cls += ' fut';
    else { const v = monthDone(habit, y, mo, d); cls += v ? ' done' : (+date < +TODAY ? ' miss' : ''); }
    if (isToday) cls += ' today';
    cells.push(`<span class="${cls}">${d}</span>`);
  }
  return `<div class="mg-head"><button data-a="month-nav" data-dir="-1" aria-label="Previous month">${I.left()}</button><b>${fmt(first, {month:'long', year:'numeric'})}</b>
      <button data-a="month-nav" data-dir="1" aria-label="Next month" ${mo >= TODAY.getMonth() ? 'disabled style="opacity:.3"' : ''}>${I.right()}</button></div>
    <div class="mgrid">${['M','T','W','T','F','S','S'].map(l => `<span class="wl">${l}</span>`).join('')}${cells.join('')}</div>`;
}
/* ---------- habit details popup ---------- */
function personTile(h, p){
  const me = p === 'me', d = isDone(h, p);
  let cls, act, inner;
  if (d && hasPhoto(h, p)){ cls = 'is-photo'; act = `data-a="view-post" data-id="${h.id}" data-p="${p}"`; inner = `${hicon(h.ic, 26, 1.3)}<span class="pav">${av(p, 20)}</span>`; }

  else { cls = 'is-todo'; act = 'disabled'; inner = `${av(p, 34)}<span class="tl">Not done<br>yet</span>`; }
  return `<button class="pt ${cls}" ${act}><span class="pimg">${inner}</span><span class="pn">${me ? 'You' : P[p].name}</span><span class="ps">${d ? h.mem[p].done : 'Not yet'}</span></button>`;
}
function todayStrip(h){
  const ppl = people(h), others = ppl.filter(p => p !== 'me').sort((a, b) => (isDone(h, b) - isDone(h, a)) || (isDone(h, a) ? tmin(h.mem[a].done) - tmin(h.mem[b].done) : 0));

const italLast = name => { const w = esc(name).split(' '); return w.length > 1 ? w.slice(0, -1).join(' ') + ' <em>' + w[w.length - 1] + '</em>' : '<em>' + w[0] + '</em>'; };

const chTotal = g => g && g.ch ? Object.values(g.ch.c).reduce((a, b) => a + b, 0) + (g.ch.others || 0) : 0;

  const f = c.friends.filter(p => FRIENDS.includes(p));

function discoverList(){
  const q = S.q.trim().toLowerCase();

    </div>`;
}
function joinCommunity(id){
  if (joined(id)) return;
  const c = C(id), f = c.friends.filter(p => FRIENDS.includes(p));
  const mem = {me:m(0, [0,0,0,0,0,0])};
  f.forEach((p, i) => { const s = 3 + i * 6; mem[p] = m(s, [0,1,1,1,1,1].map((v, k) => k > 5 - s ? 1 : v), i === 0 ? '8:45 AM' : null); });
  S.habits.push({id:c.id, name:c.habit || c.name, ic:c.ic, time:'Anytime', tod:'anytime', freq:'Every day', group:c.id, proof:true, mem});
  const cc = {me:0}; f.forEach((p, i) => cc[p] = 3 + i);
  S.groups.push({id:c.id, name:c.name, ic:c.ic, type:'community', habit:c.id, notif:'Milestones', size:c.size + 1, desc:c.desc, members:['me', ...f],
    ch:{title:`${(c.habit || c.name)}: ${Math.round(c.size * 2.5).toLocaleString()} check-ins this week`, detail:'Everyone in the community adds to one total.', unit:'check-ins', goal:Math.round(c.size * 2.5), left:4, c:cc, others:Math.round(c.size * 1.6)}, fin:[]});
  c.size += 1;
}

  const started = EVENTS.find(e => e.kind === 'started' && FRIENDS.includes(e.who));
  const comeback = EVENTS.find(e => e.kind === 'comeback' && FRIENDS.includes(e.who));
  const myBest = S.habits.reduce((b, h) => streak(h, 'me') > streak(b, 'me') ? h : b, S.habits[0]);
  const myCount = S.habits.reduce((a, h) => a + weekCount(h, 'me'), 0);

  return {perfect, second: started || comeback, myBest, myCount, photos, groups: S.groups.length, ...weekStats()};
}

function openSheet(type, data={}, tall=false){
  S.sheet = {type, ...data};
  sheetRoot.innerHTML = `<div class="backdrop" data-a="close-sheet"></div><div class="sheet ${tall ? 'tall' : ''}" role="dialog" aria-modal="true"></div>`;
  paintSheet(); void sheetRoot.offsetHeight;
  requestAnimationFrame(() => sheetRoot.classList.add('open'));
  setTimeout(() => sheetRoot.classList.add('open'), 40);
}
function paintSheet(){
  const el = $('.sheet', sheetRoot); if (!el || !S.sheet) return;
  avN = 5000; gN = 5000;
  const b = $('.sheet-body', el), st = b ? b.scrollTop : 0;
  el.innerHTML = '<div class="grabber"></div>' + SHEETS[S.sheet.type](S.sheet);
  const nb = $('.sheet-body', el); if (nb) nb.scrollTop = st;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo, ic){
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast"><span class="ti">${ic || I.check(15)}</span><span>${msg}</span>${undo ? '<button data-a="undo">Undo</button>' : ''}</div>`;
  S._undo = undo || null; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { const t = $('.toast', root); if (t){ t.classList.add('out'); setTimeout(() => t.remove(), 260); } S._undo = null; }, undo ? 4000 : 2400);
}

function checkOff(id, ask=true){
  const h = H(id); if (!h || isDone(h, 'me')) return;
  h.mem.me.done = NOW; h.mem.me.proof = false;
  const g = h.group && G(h.group); if (g && g.ch) g.ch.c.me = (g.ch.c.me || 0) + 1;     // the linked habit adds to the group total
  voiceI++; render();
  if (ask) setTimeout(() => openSheet('askphoto', {id}), 260);
}
function undoCheck(id){
  const h = H(id); if (!h) return;
  const prev = {...h.mem.me}, g = h.group && G(h.group);
  h.mem.me.done = null; h.mem.me.proof = false; if (g && g.ch && g.ch.c.me) g.ch.c.me--;
  render();
  toast(`Unstamped ${esc(h.name)}.`, () => { Object.assign(h.mem.me, prev); if (g && g.ch) g.ch.c.me++; render(); }, I.refresh(15));
}
function celebrate(g){
  ovRoot.innerHTML = `<div class="celebrate" data-a="cel-close"><div class="card panel ruled"><span class="stamp">${I.trophy(18)}Together</span>
    <div class="eyebrow acc">${esc(g.name)}</div><div class="title" style="margin-top:8px">Goal <em>reached!</em></div>

    <div class="row" style="justify-content:center;margin-top:14px">${avStack(g.members, 40, 6)}</div><button class="btn" style="margin-top:16px">Hooray!</button></div></div>`;
}
function joinInvite(id){
  const v = S.invites.find(x => x.id === id); if (!v) return;
  const mem = {me:m(0, [0,0,0,0,0,0])};
  v.members.forEach((p, i) => mem[p] = m(2 + i * 3, [0,1,1,1,1,1], i < 2 ? `${8 + i}:${pad2(10 + i * 25)} AM` : null));
  S.habits.push({id:'h-' + v.id, name:'Get outside', ic:v.ic, time:'Anytime', tod:'anytime', freq:'Every day', group:v.id, proof:true, mem});
  S.groups.push({id:v.id, name:v.name, ic:v.ic, type:'friends', habit:'h-' + v.id, notif:'Everything', desc:v.desc, members:['me', ...v.members], ch:{...v.ch, c:{...v.ch.c, me:0}}, fin:[]});
  S.invites = S.invites.filter(x => x.id !== id);
  const n = S.notifs.find(x => x.group === id); if (n){ n.res = 'Accepted'; n.unread = false; }
}
function jumpTo(to){
  if ($('#ws') || $('.celebrate')) ovRoot.innerHTML = '';
  if (S.sheet) closeSheet();
  if (to === 'onboard'){ S.mode = 'onboard'; S.step = 0; render(); return; }
  S.mode = 'app'; S.stack = [];
  if (to === 'friends' || to === 'profile'){ S.tab = to === 'friends' ? 'groups' : 'today'; S.stack = [{r:to}]; }
  else S.tab = to;
  render();
}

    const goalN = parseInt(f.goal, 10) || 20;
    S.groups.unshift({id, name, ic:f.ic, type:'friends', habit:f.fromHabit || null, notif:'Everything', desc:f.desc.trim() || 'A new circle. Be kind, show up.', members,
      ch:f.goal.trim() ? {title:f.goal.trim(), detail:'Your first challenge together.', unit:'check-ins', goal:goalN, left:7, c} : null, fin:[]});
    if (f.fromHabit){ const h = H(f.fromHabit); h.group = id; f.friends.forEach(p => h.mem[p] = m(0, [0,0,0,0,0,0])); }
    closeSheet(); S.tab = 'groups'; S.stack = [{r:'group', id}]; render(); toast(`${esc(name)} is ready`); },
  community(t){ openSheet('community', {id:t.dataset.id}); },
  join(t){ const c = C(t.dataset.id); if (joined(c.id)){ ACT['open-group'](t); return; } joinCommunity(c.id); render(); if (S.sheet && S.sheet.type === 'community') paintSheet();
    toast(`Joined ${esc(c.name)} · it’s in your groups`); },
  'inv-join'(t){ const v = S.invites.find(x => x.id === t.dataset.id); joinInvite(t.dataset.id); render(); toast(`Joined ${esc(v ? v.name : 'the group')}`); },
  'inv-no'(t){ const i = S.invites.findIndex(x => x.id === t.dataset.id), v = S.invites[i]; S.invites.splice(i, 1); render(); toast('Invitation hidden', () => { S.invites.splice(i, 0, v); render(); }); },
  'log-one'(t){ const g = G(t.dataset.id), before = chTotal(g); g.ch.c.me = (g.ch.c.me || 0) + 1; render();
    if (before < g.ch.goal && chTotal(g) >= g.ch.goal) celebrate(g); else toast(`Logged one for ${esc(g.name)}`); },
  'log-minus'(t){ const g = G(t.dataset.id); if (g.ch.c.me) g.ch.c.me--; render(); },
  'cel-close'(){ ovRoot.innerHTML = ''; },
  'g-notif'(t){ G(t.dataset.id).notif = t.dataset.v; render(); },
  'group-menu'(t){ openSheet('groupmenu', {id:t.dataset.id}); },
  'invite-friends'(t){ openSheet('invitefriends', {id:t.dataset.id, sel:new Set()}); },
  'inv-pick'(t){ const s = S.sheet.sel, p = t.dataset.p; s.has(p) ? s.delete(p) : s.add(p); paintSheet(); },
  'inv-send'(t){ const g = G(t.dataset.id), sel = [...S.sheet.sel]; sel.forEach(p => { g.members.push(p); if (g.ch) g.ch.c[p] = 0; const h = g.habit && H(g.habit); if (h) h.mem[p] = m(0, [0,0,0,0,0,0]); });
    closeSheet(); render(); toast(`Invited ${sel.map(p => P[p].name).join(' and ')}`); },
  'leave-group'(t){ const id = t.dataset.id, gi = S.groups.findIndex(g => g.id === id), g = S.groups[gi], h = g.habit && H(g.habit);
    const snapH = h ? JSON.parse(JSON.stringify(h)) : null, hi = h ? S.habits.indexOf(h) : -1;
    S.groups.splice(gi, 1);
    if (h){ if (g.type === 'community') S.habits.splice(hi, 1); else { h.group = null; Object.keys(h.mem).forEach(p => { if (p !== 'me') delete h.mem[p]; }); } }
    if (S.sheet) closeSheet(); if (topRoute() && topRoute().id === id) S.stack.pop(); render();
    toast(`Left ${esc(g.name)}`, () => { S.groups.splice(gi, 0, g); if (snapH){ if (g.type === 'community') S.habits.splice(hi, 0, snapH); else Object.assign(H(snapH.id), snapH); } render(); }, I.leave(15)); },
  cat(t){ S.cat = t.dataset.to; render(); },
  react(t){ openSheet('react', {k:t.dataset.k}); },
  'rx-pick'(t){ const k = t.dataset.k, v = t.dataset.v, had = S.reacts[k] === v; if (had) delete S.reacts[k]; else S.reacts[k] = v; closeSheet(); render();
    toast(had ? 'Reaction removed' : `Sent ${RX.find(r => r.k === v).l}`, null, I[RX.find(r => r.k === v).ic](15)); },
  comments(t){ openSheet('comments', {k:t.dataset.k, text:''}, true); },
  'quick-cm'(t){ S.sheet.text = t.dataset.v; paintSheet(); },
  'send-cm'(t){ const k = t.dataset.k, txt = (S.sheet.text || '').trim(); if (!txt) return; (S.comments[k] || (S.comments[k] = [])).push({p:'me', t:txt}); S.sheet.text = ''; paintSheet(); render(); toast('Comment posted', null, I.comment(14)); },
  'remove-row'(t){ const p = t.dataset.p, i = FRIENDS.indexOf(p); if (i < 0) return; FRIENDS.splice(i, 1); render();
    toast(`Removed ${P[p].name}`, () => { FRIENDS.splice(i, 0, p); render(); }, I.x(14)); },
  'accept-req'(t){ const p = t.dataset.p; if (!FRIENDS.includes(p)) FRIENDS.push(p); P[p].mutual = P[p].mutual || 1; P[p].since = 'Oct 2026';
    S.requests = S.requests.filter(x => x !== p); const n = S.notifs.find(x => x.who === p && x.kind === 'friend'); if (n){ n.res = 'Accepted'; n.unread = false; }
    render(); toast(`You and ${P[p].name} are friends now`, null, I.heart(15)); },
  'decline-req'(t){ const p = t.dataset.p; S.requests = S.requests.filter(x => x !== p); const n = S.notifs.find(x => x.who === p && x.kind === 'friend'); if (n){ n.res = 'Declined'; n.unread = false; } render(); },
  'contact-invite'(t){ S['inv' + t.dataset.i] = true; render(); toast('Invite sent', null, I.invite(15)); },
  'friend-menu'(t){ openSheet('friendmenu', {p:t.dataset.p}); },
  'remove-friend'(t){ const p = t.dataset.p, i = FRIENDS.indexOf(p); FRIENDS.splice(i, 1); closeSheet(); S.stack.pop(); render(); toast(`Removed ${P[p].name}`, () => { FRIENDS.splice(i, 0, p); render(); }); },
  'invite-habit'(t){ openSheet('invitehabit', {p:t.dataset.p}); },
  'invite-to-habit'(t){ const h = H(t.dataset.id), p = t.dataset.p; h.mem[p] = m(0, [0,0,0,0,0,0]); closeSheet(); render(); toast(`Invited ${P[p].name} to ${esc(h.name)}`, null, I.invite(15)); },
  notif(t){ const n = S.notifs.find(x => x.id === t.dataset.id); n.unread = false;
    if (n.kind === 'recap'){ S.stack = []; S.tab = 'recap'; } else if (n.kind === 'award'){ S.stack = []; S.tab = 'trophies'; }
    else if (n.kind === 'milestone'){ S.stack.push({r:'group', id:'hydration'}); } else if (n.who && FRIENDS.includes(n.who)) S.stack.push({r:'friend', id:n.who});
    render(); },
  'notif-yes'(t){ const n = S.notifs.find(x => x.id === t.dataset.id);
    if (n.kind === 'friend') ACT['accept-req']({dataset:{p:n.who}}); else if (n.kind === 'invite'){ joinInvite(n.group); render(); toast('Joined Touch Grass Club'); } },
  'notif-no'(t){ const n = S.notifs.find(x => x.id === t.dataset.id); n.res = 'Declined'; n.unread = false; if (n.kind === 'friend') S.requests = S.requests.filter(x => x !== n.who); if (n.kind === 'invite') S.invites = S.invites.filter(v => v.id !== n.group); render(); },
  'mark-read'(){ S.notifs.forEach(n => n.unread = false); render(); toast('All caught up'); },
  trophy(t){ const tr = T(t.dataset.id); openSheet('trophy', {id:tr.id}); if (tr.fresh){ tr.fresh = false; render(); } },
  'tr-view'(){ S.trView = S.trView === 'book' ? 'grid' : 'book'; render(); },
  'tr-filter'(t){ S.trFilter = t.dataset.v; render(); },
  'tr-page'(t){ const el = $('#page-' + t.dataset.v); if (el) el.scrollIntoView({block:'start', behavior:'smooth'}); },
  pin(t){ const id = t.dataset.id; if (S.pinned.has(id)) S.pinned.delete(id); else if (S.pinned.size >= 6){ toast('Your showcase holds 6. Unpin one first.'); return; } else S.pinned.add(id); paintSheet(); render(); },
  'play-recap'(){ openSummary(); },
  'ws-open'(){ const ws = $('#ws'); if (!ws || ws.classList.contains('opened')) return; ws.classList.add('opened'); setTimeout(() => wsGo(0), 1100); },
  'ws-next'(){ if (wsI < WS_N - 1) wsGo(wsI + 1); }, 'ws-prev'(){ if (wsI > 0) wsGo(wsI - 1); },
  'ws-close'(){ closeSummary(); },
  'ws-trophies'(){ S.mode = 'app'; S.tab = 'trophies'; S.stack = []; closeSummary(); },
  'avatar-picker'(){ openSheet('avatar', {sel:S.myAv}); },
  'av-sel'(t){ S.sheet.sel = t.dataset.id; paintSheet(); },
  'av-save'(){ S.myAv = S.sheet.sel; closeSheet(); render(); toast('Avatar updated'); },
  'edit-profile'(){ openSheet('editprofile', {full:P.me.full, bio:P.me.bio}); },
  'profile-save'(){ P.me.full = S.sheet.full.trim() || P.me.full; P.me.bio = S.sheet.bio.trim(); closeSheet(); render(); toast('Profile saved'); },
  setting(t){ const k = t.dataset.k; S.settings[k] = !S.settings[k]; render(); },
  'month-nav'(t){ const mo = DET.mo + +t.dataset.dir; if (mo > TODAY.getMonth() || mo < 0) return; DET.mo = mo; paintSheet(); },
  'close-sheet'(){ closeSheet(); },
  toast(t){ toast(t.dataset.msg); },
  undo(){ const fn = S._undo; S._undo = null; $('#toast-root').innerHTML = ''; if (fn) fn(); }
};

document.addEventListener('click', e => {
  const fld = e.target.closest('.field');
  if (fld && !e.target.matches('input,textarea')){ const i = fld.querySelector('input,textarea'); if (i) i.focus(); }
  const t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.a]; if (fn) fn(t, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){ S.q = t.value; const l = $('#disc-list'); if (l) l.innerHTML = discoverList(); return; }
  if (t.dataset.f && S.sheet) S.sheet[t.dataset.f] = t.value;
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-a]')){ e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape'){ if (S.sheet) closeSheet(); else if ($('#ws')) closeSummary(); else if ($('.celebrate')) ovRoot.innerHTML = ''; }
  if ($('#ws') && $('#ws').classList.contains('opened')){ if (e.key === 'ArrowRight') ACT['ws-next'](); if (e.key === 'ArrowLeft') ACT['ws-prev'](); }
});

/* ---------- community banner: auto-advances, pauses while touched ---------- */
let spotPos = 0, spotHold = 0;
function spotSync(){
  const sp = $('#spot'); if (!sp || !sp.firstElementChild) return;
  const step = sp.firstElementChild.offsetWidth + 10, i = Math.round(sp.scrollLeft / step);
  document.querySelectorAll('#spot-dots i').forEach((d, k) => d.classList.toggle('on', k === i));
  spotPos = sp.scrollLeft;
}
document.addEventListener('scroll', e => { if (e.target.id === 'spot') spotSync(); }, true);
['pointerdown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('#spot')) spotHold = Date.now() + 8000; }, {passive:true, capture:true}));
setInterval(() => {
  const sp = $('#spot');
  if (!sp || !sp.firstElementChild || Date.now() < spotHold || S.sheet || $('#ws') || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const n = sp.children.length, step = sp.firstElementChild.offsetWidth + 10, i = Math.round(sp.scrollLeft / step);
  sp.scrollTo({left: i + 1 >= n ? 0 : (i + 1) * step, behavior:'smooth'});
}, 4200);

/* ---------- fit the phone to the window on desktop (transform keeps hit-testing exact) ---------- */
function fitDevice(){
  const d = $('.device');
  if (innerWidth <= 480){ d.style.transform = d.style.margin = ''; return; }
  const z = Math.min(1, (innerHeight - 72) / 866);
  d.style.transform = z < 1 ? `scale(${z})` : '';
  d.style.margin = z < 1 ? `${-(1 - z) * 433}px ${-(1 - z) * 195}px` : '';
}
addEventListener('resize', fitDevice); fitDevice();

/* ---------- font picker hooks: font-picker.html sends these messages to restyle the app live ---------- */
function applyFonts(f){
  if (!f) return;
  if (f.href && !document.querySelector(`link[data-font="${f.id}"]`)){
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = f.href; l.dataset.font = f.id; document.head.appendChild(l);
  }
  const r = document.documentElement.style;
  r.setProperty('--serif', f.serif); r.setProperty('--sans', f.sans); r.setProperty('--mono', f.mono);
  r.setProperty('--ds', f.ds || 1); r.setProperty('--sw', f.sw || 400);
}
function gotoPage(to){
  if (S.sheet) closeSheet();
  if (to === 'details'){ jumpTo('today'); openSheet('details', {id:'water'}, true); }
  else if (to === 'group'){ jumpTo('groups'); S.stack = [{r:'group', id:'hydration'}]; render(); }
  else if (to === 'curtain'){ jumpTo('recap'); openSummary(); ACT['ws-open'](); setTimeout(() => wsGo(0), 1150); }
  else if (to === 'onboard1'){ jumpTo('onboard'); S.step = 1; render(); }
  else jumpTo(to);
}
addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'daybook-fonts') applyFonts(d.font);
  else if (d.type === 'daybook-goto') gotoPage(d.to);
  else if (d.type === 'daybook-theme') setTheme(d.theme);
});

/* ---------- start: onboarding, or a deep link #today #groups #friends #trophies #recap #profile (+ &stage, &still) ---------- */
render();
const params = Object.fromEntries((location.hash.slice(1) || window.__deeplink || '').split('&').filter(Boolean).map(x => { const [k, v] = x.split('='); return [k, v === undefined ? true : decodeURIComponent(v)]; }));
if (params.stage) setTheme('stage');
if (params.still) spotHold = Date.now() + 1e12;
const startAt = ['onboard','today','groups','friends','trophies','recap','profile'].find(k => params[k]);
if (startAt) jumpTo(startAt);
if (params.details) openSheet('details', {id:params.details}, true);
if (params.group){ S.mode = 'app'; S.tab = 'groups'; S.stack = [{r:'group', id:params.group}]; render(); }
</script>
